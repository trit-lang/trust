[package]
name = "trustc"
description = "The Trust compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trit-core.workspace = true

[dev-dependencies]
# The end-to-end tests run generated code on the reference machine. Only the
# tests need it: the compiler itself emits assembly text and stops there.
tritium = { path = "../vm" }

[lib]
name = "trustc"
path = "src/lib.rs"

[[bin]]
name = "trustc"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
