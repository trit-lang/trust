name = "Trust"
grammar = "trust"
path_suffixes = ["tr"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
# What may sit immediately after the cursor without a closing bracket being
# inserted for it.
autoclose_before = ";:.,=}])>"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
